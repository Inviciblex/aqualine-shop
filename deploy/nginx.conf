server {
    # Непривилегированный nginx (uid 101) не может биндить порты < 1024,
    # поэтому слушаем 8080. Наружу маппится host:80 → container:8080 (compose).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip для текстовых ресурсов
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Запросы к API → на контейнер бэкенда (имя сервиса в docker-compose: api).
    # Браузер обращается к тому же домену, поэтому CORS не задействован.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэшируем собранные ассеты надолго (имена файлов содержат хеш).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # products.json не кэшируем — чтобы правки каталога подхватывались сразу.
    location = /products.json {
        add_header Cache-Control "no-cache";
    }

    # Корректный MIME для PWA-манифеста (по умолчанию nginx отдаёт octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA-фоллбэк (на случай прямых заходов); типы MIME берутся из стандартного
    # mime.types образа nginx, поэтому .js отдаётся корректно.
    location / {
        try_files $uri /index.html;
    }
}
