server {
    # Непривилегированный nginx (uid 101) не может биндить порты < 1024,
    # поэтому слушаем 8080. Наружу маппится host:80 → container:8080 (compose).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Заголовки безопасности (применяются к HTML-документу) ──
    # img-src https: — товарные фото берутся с внешних URL; style 'unsafe-inline'
    # нужен для inline-стилей React; connect docs.google.com + *.googleusercontent.com —
    # опциональный источник каталога (Google Таблица): published-CSV редиректит с
    # docs.google.com на googleusercontent.com, нужны оба хоста. frame-src yandex.ru —
    # встроенная карта на «Контактах». script-src 'self' — Vite externalizes JS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; frame-src https://yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Действует только по HTTPS (за TLS-прокси); по HTTP браузер игнорирует.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Сжатие текстовых ресурсов. Brotli плотнее gzip на ~15–20% (модуль собран в
    # Dockerfile). Клиенты без Accept-Encoding: br откатываются на gzip.
    brotli on;
    brotli_comp_level 6;
    brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    brotli_min_length 1024;

    # gzip для текстовых ресурсов (fallback для клиентов без brotli)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Запросы к API → на контейнер бэкенда (имя сервиса в docker-compose: api).
    # Браузер обращается к тому же домену, поэтому CORS не задействован.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэшируем собранные ассеты надолго (имена файлов содержат хеш).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # products.json не кэшируем — чтобы правки каталога подхватывались сразу.
    location = /products.json {
        add_header Cache-Control "no-cache";
    }

    # Товарные фото — из bind-mount тома (вне образа, обновляются без пересборки).
    # Кэшируем; отсутствующий файл → 404, а не SPA-фоллбэк на index.html.
    location /img/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Загруженные в админке фото товаров — из общего с api тома (см. docker-compose).
    location /media/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Корректный MIME для PWA-манифеста (по умолчанию nginx отдаёт octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA-фоллбэк (на случай прямых заходов); типы MIME берутся из стандартного
    # mime.types образа nginx, поэтому .js отдаётся корректно.
    location / {
        try_files $uri /index.html;
    }
}
