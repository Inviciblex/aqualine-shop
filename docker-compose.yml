# Локальный запуск со сборкой образов из исходников.
# Использование:  docker compose up -d --build
# Открыть:        http://localhost
#
# Перед запуском создайте server/.env (из server/.env.example) с токеном бота и т.д.

services:
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      - DB_PATH=/data/orders.db
    volumes:
      - db:/data            # SQLite-база живёт в томе и не теряется при пересборке
    expose:
      - "8787"
    # ── Усиление безопасности ──
    security_opt:
      - no-new-privileges:true   # процесс не может повысить привилегии через setuid
    cap_drop:
      - ALL                      # node слушает непривилегированный 8787 — capabilities не нужны
    read_only: true              # корневая ФС только для чтения; пишем лишь в том /data
    tmpfs:
      - /tmp                     # /tmp поверх tmpfs (нужен некоторым операциям node)

  web:
    build:
      context: .
      args:
        VITE_ORDER_API_URL: /api/order
        # Источник каталога: адрес опубликованного CSV Google-таблицы.
        # Берётся из корневого .env (VITE_SHEET_CSV_URL). Пусто →
        # каталог грузится из public/products.json.
        VITE_SHEET_CSV_URL: ${VITE_SHEET_CSV_URL:-}
        # Оптимизация фото через image-proxy (напр. weserv). Пусто → фото как есть.
        VITE_IMG_PROXY: ${VITE_IMG_PROXY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy   # ждём, пока бэкенд пройдёт HEALTHCHECK
    ports:
      - "80:8080"                # host:80 → непривилегированный nginx в контейнере на :8080
    # Товарные фото — не в образе, а из этого каталога (bind-mount, только чтение):
    # растущий каталог не раздувает образ, фото обновляются без пересборки.
    volumes:
      - ./public/img:/usr/share/nginx/html/img:ro
    # ── Усиление безопасности ──
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                      # nginx-unprivileged уже non-root на 8080 — capabilities не нужны
    read_only: true
    tmpfs:                       # nginx пишет кэш/pid/temp — выносим в tmpfs
      - /var/cache/nginx
      - /tmp
    # healthcheck определён в самом образе (Dockerfile), здесь не дублируем

volumes:
  db:
