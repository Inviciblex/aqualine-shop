name: CI / Deploy

# Модель git flow:
#   • Pull Request в main/develop → только проверка сборки (образы собираются,
#     но НЕ пушатся и НЕ деплоятся). Защищает develop/main от нерабочего кода.
#   • Push тега vX.Y.Z          → сборка образов, публикация в GHCR и деплой
#     на прод по SSH. Прод обновляется ТОЛЬКО релизным тегом.
#   • workflow_dispatch          → ручной запуск (на выбранном теге).
on:
  push:
    branches: [main, develop]   # прямой push в интеграционные ветки → прогон тестов
    tags: ['v*.*.*']            # релизный тег → тесты + сборка + деплой
  pull_request:
    branches: [main, develop]   # PR → тесты + проверка сборки
  workflow_dispatch:

jobs:
  # ── Проверки кода: линт, форматирование, тесты фронта и бэка. Гоняются на
  #    каждый PR и на релизный тег. Релиз не соберётся, если что-то красное. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16'   # >= 22.13: нужен встроенный node:sqlite
      - name: Установка зависимостей
        run: npm ci
      - name: Линт (ESLint)
        run: npm run lint
      - name: Форматирование (Prettier)
        run: npm run format:check
      - name: Тесты фронтенда (с порогом покрытия)
        run: npm run test:coverage
      - name: Тесты бэкенда (с порогом покрытия)
        working-directory: ./server
        run: npm run test:coverage

  # ── Проверка сборки на каждый PR: образы собираются, но никуда не уходят ──
  verify:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API (без публикации)
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
      - name: Build Web (без публикации)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VITE_ORDER_API_URL=/api/order
            VITE_SHEET_CSV_URL=${{ vars.VITE_SHEET_CSV_URL }}
            VITE_IMG_PROXY=${{ vars.VITE_IMG_PROXY }}

  # ── Сборка и публикация образов — только на релизный тег ──
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # owner в нижнем регистре (требование GHCR), version = имя тега (vX.Y.Z).
      - id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/aqualine-api:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/aqualine-api:${{ steps.prep.outputs.version }}

      - name: Build & push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_ORDER_API_URL=/api/order
            VITE_SHEET_CSV_URL=${{ vars.VITE_SHEET_CSV_URL }}
            VITE_IMG_PROXY=${{ vars.VITE_IMG_PROXY }}
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/aqualine-web:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/aqualine-web:${{ steps.prep.outputs.version }}

  # ── Деплой на прод по SSH — тоже только на релизный тег ──
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Гейт ручного подтверждения: job ждёт Approve в Actions UI, если в
    # Settings → Environments → production включить Required reviewers.
    # Сборка/публикация образов (job build) при этом остаётся автоматической.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Логин в GHCR на сервере (нужен PAT с правом read:packages).
            # Если сделать образы публичными в GitHub, эту строку можно убрать.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Тег предыдущего успешного деплоя — для отката, если новый не поднимется.
            PREV_TAG=$(cat .deployed_tag 2>/dev/null || echo "")
            COMPOSE="docker compose -f docker-compose.prod.yml"
            # Разворачиваем именно версию из тега (compose читает $TAG; см. docker-compose.prod.yml).
            export TAG=${{ github.ref_name }}
            $COMPOSE pull
            $COMPOSE up -d

            # Ждём, пока сайт и API реально отвечают (up -d зелёный ещё не значит
            # «работает»: контейнер мог упасть в рестарт-цикл). До ~90 секунд.
            ok=""
            for i in $(seq 1 18); do
              sleep 5
              if curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1 \
                 && curl -fsS http://127.0.0.1/ >/dev/null 2>&1; then
                ok=1; break
              fi
            done

            if [ -z "$ok" ]; then
              echo "::error::Деплой $TAG не прошёл health-check"
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
                echo "Откат на предыдущую версию $PREV_TAG"
                export TAG=$PREV_TAG
                $COMPOSE up -d || true
              fi
              exit 1
            fi

            # Успех: запоминаем версию и чистим только старые образы (>7 дней),
            # чтобы предыдущий остался доступным для отката.
            echo "$TAG" > .deployed_tag
            docker image prune -f --filter "until=168h"
