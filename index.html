<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- По умолчанию индексируем. Личные страницы (/favorites, /orders) на лету
         переключаются на noindex из src/seo.js — они тонкие и персональные. -->
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Аквалин — магазин сантехники: смесители, раковины, унитазы, душевые системы и комплектующие. Самовывоз."
    />
    <title>Аквалин — сантехника</title>

    <!-- Каноническая ссылка. ЗАМЕНИТЕ домен на свой перед запуском. -->
    <link rel="canonical" href="https://ваш-домен.ру/" />

    <!-- Иконки и PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e6b7a" />

    <!-- Open Graph / Twitter (превью при шеринге ссылки) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Аквалин" />
    <meta property="og:title" content="Аквалин — сантехника" />
    <meta
      property="og:description"
      content="Смесители, раковины, унитазы, душевые системы. Понятные цены, наличие на складе, самовывоз."
    />
    <!-- og:url/og:image по умолчанию — для главной; на странице товара JS (src/seo.js)
         подставляет реальный адрес и первое фото товара. ЗАМЕНИТЕ домен и добавьте
         картинку 1200×630 в public/og-image.png перед запуском (см. LAUNCH.md). -->
    <meta property="og:url" content="https://ваш-домен.ру/" />
    <meta property="og:image" content="https://ваш-домен.ру/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Аквалин — сантехника" />
    <meta
      name="twitter:description"
      content="Смесители, раковины, унитазы, душевые системы. Самовывоз."
    />
    <meta name="twitter:image" content="https://ваш-домен.ру/og-image.png" />

    <!-- Шрифты подключаются локально через src/main.jsx (@fontsource), без Google Fonts CDN. -->

    <!-- Ранний коннект к внешним источникам на критическом пути: image-proxy фото
         и Google-таблица каталога (экономит DNS+TCP+TLS до первого запроса). -->
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin />
    <link rel="preconnect" href="https://docs.google.com" />

    <!-- Структурированные данные о магазине (schema.org Store). Главная — реальный
         URL, поэтому эта разметка индексируется и помогает локальному поиску
         (карточка организации, адрес, часы). type="application/ld+json" — это блок
         данных, а не исполняемый скрипт, поэтому строгая CSP его не блокирует.
         ЗАМЕНИТЕ перед запуском: url, и при наличии — geo-координаты. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Аквалин",
        "description": "Магазин сантехники: смесители, раковины, унитазы, душевые системы и комплектующие. Самовывоз.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ул. Володи Головатого, 286/1",
          "addressLocality": "Краснодар",
          "addressCountry": "RU"
        },
        "telephone": "+79182191954",
        "openingHours": ["Mo-Su 08:00-17:00"],
        "currenciesAccepted": "RUB",
        "priceRange": "₽₽"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
