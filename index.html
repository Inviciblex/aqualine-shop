<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Аквалин — магазин сантехники: смесители, раковины, унитазы, душевые системы и комплектующие. Самовывоз." />
    <title>Аквалин — сантехника</title>

    <!-- Иконки и PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e6b7a" />

    <!-- Open Graph / Twitter (превью при шеринге ссылки) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Аквалин" />
    <meta property="og:title" content="Аквалин — сантехника" />
    <meta property="og:description" content="Смесители, раковины, унитазы, душевые системы. Понятные цены, наличие на складе, самовывоз." />
    <!-- Укажите свой домен и добавьте картинку 1200×630 в public/ (og:url, og:image): -->
    <!-- <meta property="og:url" content="https://ваш-домен.ру/" /> -->
    <!-- <meta property="og:image" content="https://ваш-домен.ру/og-image.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Аквалин — сантехника" />
    <meta name="twitter:description" content="Смесители, раковины, унитазы, душевые системы. Самовывоз." />

    <!-- Шрифты подключаются локально через src/main.jsx (@fontsource), без Google Fonts CDN. -->

    <!-- Структурированные данные о магазине (schema.org Store). Главная — реальный
         URL, поэтому эта разметка индексируется и помогает локальному поиску
         (карточка организации, адрес, часы). type="application/ld+json" — это блок
         данных, а не исполняемый скрипт, поэтому строгая CSP его не блокирует.
         ЗАМЕНИТЕ перед запуском: telephone, url, и при наличии — geo-координаты. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Аквалин",
        "description": "Магазин сантехники: смесители, раковины, унитазы, душевые системы и комплектующие. Самовывоз.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ул. Володи Головатого, 286/1",
          "addressLocality": "Краснодар",
          "addressCountry": "RU"
        },
        "openingHours": ["Mo-Fr 09:00-19:00", "Sa 10:00-16:00"],
        "currenciesAccepted": "RUB",
        "priceRange": "₽₽"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
