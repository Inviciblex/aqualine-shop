<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Аквалин — админка заказов</title>
  <style>
    :root {
      --bg:#f6f8f9; --surface:#fff; --ink:#16222b; --soft:#56666f; --line:#e3e9ec;
      --line2:#cdd6db; --accent:#0e6b7a; --accent-d:#0a525e; --tint:#e6f0f1; --danger:#c0392b;
      --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
      --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    .wrap{max-width:920px;margin:0 auto;padding:24px 18px 60px}
    h1{font-size:1.4rem;letter-spacing:-.02em;margin:0 0 4px}
    .sub{color:var(--soft);font-size:.88rem;margin:0 0 22px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
    label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-bottom:6px}
    input,select{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:inherit;font-size:.92rem;background:var(--surface);color:var(--ink)}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
    .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
    .row>div{flex:1;min-width:160px}
    button{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:8px;padding:10px 16px;background:var(--accent);color:#fff}
    button:hover{background:var(--accent-d)}
    button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line2)}
    .err{color:var(--danger);font-size:.85rem;margin-top:10px}
    .muted{color:var(--soft)}
    .order{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;margin-bottom:12px}
    .ohead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .oid{font-family:var(--mono);font-weight:700}
    .odate{font-size:.8rem;color:var(--soft)}
    .cust{font-size:.9rem;margin:8px 0}
    .cust b{font-weight:600}
    .items{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:.88rem}
    .items li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
    .mono{font-family:var(--mono)}
    .ofoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
    .total{font-family:var(--mono);font-weight:700;font-size:1.05rem}
    .statusctl{display:flex;gap:8px;align-items:center}
    .statusctl select{width:auto;min-width:180px}
    .saved{color:#1f7a3d;font-size:.82rem}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .filterbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .filterbar #search{flex:1;min-width:200px}
    .filterbar #statusFilter{width:auto;min-width:160px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Админка заказов</h1>
    <p class="sub">Аквалин · управление статусами заказов</p>

    <!-- Экран входа -->
    <div id="login" class="card">
      <div class="row">
        <div>
          <label for="api">Адрес API</label>
          <input id="api" value="/api" />
        </div>
        <div>
          <label for="token">Админ-токен</label>
          <input id="token" type="password" placeholder="ADMIN_TOKEN с сервера" />
        </div>
        <button id="loginBtn">Войти</button>
      </div>
      <div id="loginErr" class="err" style="display:none"></div>
      <p class="muted" style="font-size:.82rem;margin:12px 0 0">
        Токен задаётся на сервере в <span class="mono">server/.env</span> →
        <span class="mono">ADMIN_TOKEN</span>. Открывайте админку только по HTTPS.
      </p>
    </div>

    <!-- Список заказов -->
    <div id="app" style="display:none">
      <div class="topbar">
        <span class="muted" id="count"></span>
        <span>
          <button class="ghost" id="export">Экспорт CSV</button>
          <button class="ghost" id="refresh">Обновить</button>
          <button class="ghost" id="logout">Выйти</button>
        </span>
      </div>
      <div class="filterbar">
        <input id="search" placeholder="Поиск: номер, имя, телефон…" />
        <select id="statusFilter">
          <option value="">Все статусы</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <!-- Логика вынесена в /admin.js: строгая CSP (script-src 'self') блокирует
       инлайновые скрипты, поэтому код грузится отдельным файлом с того же домена. -->
  <script src="/admin.js"></script>
</body>
</html>
