# Боевой compose для сервера: тянет готовые образы из GHCR (их собирает GitHub
# Actions на релизный тег vX.Y.Z). Сборка на сервере не нужна.
#
# Рядом с этим файлом на сервере должен лежать:
#   .env          — переменные подстановки compose: IMAGE_PREFIX и TAG
#                   (пример — .env.deploy.example)
#   server/.env   — секреты приложения: TG_BOT_TOKEN, TG_CHAT_ID, ADMIN_TOKEN…
#
# Обновление вручную:  docker compose -f docker-compose.prod.yml pull && \
#                      docker compose -f docker-compose.prod.yml up -d
# (но обычно это делает GitHub Actions автоматически)

# Ротация логов: json-file без предела заполнил бы диск на долгоживущем сервере.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    image: ${IMAGE_PREFIX}/aqualine-api:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file: ./server/.env
    environment:
      - DB_PATH=/data/orders.db
    volumes:
      - db:/data
    expose:
      - "8787"
    # ── Усиление безопасности ──
    security_opt:
      - no-new-privileges:true   # процесс не может повысить привилегии через setuid
    cap_drop:
      - ALL                      # node слушает непривилегированный 8787 — capabilities не нужны
    read_only: true              # корневая ФС только для чтения; пишем лишь в том /data
    tmpfs:
      - /tmp

  web:
    image: ${IMAGE_PREFIX}/aqualine-web:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy   # ждём, пока бэкенд пройдёт HEALTHCHECK
    ports:
      - "80:8080"                # host:80 → непривилегированный nginx в контейнере на :8080
    # Товарные фото — не в образе, а из каталога ./public/img рядом с этим файлом
    # (bind-mount, только чтение). На сервере создайте public/img/ и загрузите туда
    # фото (SFTP) — образ не раздувается, фото обновляются без пересборки.
    volumes:
      - ./public/img:/usr/share/nginx/html/img:ro
    # ── Усиление безопасности ──
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                      # nginx-unprivileged уже non-root на 8080 — capabilities не нужны
    read_only: true
    tmpfs:                       # nginx пишет кэш/pid/temp — выносим в tmpfs
      - /var/cache/nginx
      - /tmp
    # healthcheck определён в самом образе (Dockerfile), здесь не дублируем

volumes:
  db:
